<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Axi and the 37 tabs</title><desc id="desc">A playful pink axolotl looks at a phone while browser tabs and internet distractions float around it.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF2F5"/><stop offset="1" stop-color="#E8E8FF"/></linearGradient><linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB4C8"/><stop offset="1" stop-color="#FF5C8A"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17203C" flood-opacity=".15"/></filter></defs><rect width="1200" height="630" rx="30" fill="url(#bg)"/><circle cx="1030" cy="90" r="90" fill="#FFD9E4" opacity=".6"/><circle cx="120" cy="540" r="120" fill="#D9D8FF" opacity=".65"/><g font-family="Arial,Helvetica,sans-serif" filter="url(#shadow)"><g transform="translate(60 80) rotate(-7)"><rect width="270" height="108" rx="15" fill="#fff" stroke="#7CA7FF" stroke-width="4"/><rect width="270" height="27" rx="13" fill="#DDE8FF"/><circle cx="18" cy="13" r="4" fill="#FF6F91"/><circle cx="32" cy="13" r="4" fill="#FFCE5C"/><circle cx="46" cy="13" r="4" fill="#5CD5B0"/><text x="18" y="65" font-size="21" font-weight="700" fill="#192344">How to be productive</text><text x="18" y="88" font-size="15" fill="#63708C">Step 1: open 47 tabs</text></g><g transform="translate(385 48) rotate(5)"><rect width="260" height="108" rx="15" fill="#fff" stroke="#7CA7FF" stroke-width="4"/><rect width="260" height="27" rx="13" fill="#DDE8FF"/><text x="18" y="66" font-size="24" font-weight="700" fill="#192344">Is cereal soup?</text></g><g transform="translate(770 76) rotate(-4)"><rect width="350" height="110" rx="15" fill="#fff" stroke="#7CA7FF" stroke-width="4"/><rect width="350" height="27" rx="13" fill="#DDE8FF"/><text x="18" y="65" font-size="22" font-weight="700" fill="#192344">Why do houseplants hate me?</text></g><g transform="translate(55 410) rotate(4)"><rect width="300" height="95" rx="15" fill="#fff" stroke="#7CA7FF" stroke-width="4"/><rect width="300" height="26" rx="13" fill="#DDE8FF"/><text x="17" y="62" font-size="22" font-weight="700" fill="#192344">Best side hustles</text></g><g transform="translate(850 400) rotate(5)"><rect width="280" height="100" rx="15" fill="#fff" stroke="#7CA7FF" stroke-width="4"/><rect width="280" height="26" rx="13" fill="#DDE8FF"/><text x="17" y="62" font-size="21" font-weight="700" fill="#192344">New personality unlocked</text></g></g><g transform="translate(425 205)" filter="url(#shadow)"><path d="M45 75 C5 45 8 4 38 22 C57 34 57 56 57 65" fill="#FF6F91" stroke="#D94373" stroke-width="5"/><path d="M55 64 C20 12 45 -7 62 14 C75 31 69 50 68 63" fill="#FF9DB7" stroke="#D94373" stroke-width="5"/><path d="M285 75 C325 45 322 4 292 22 C273 34 273 56 273 65" fill="#FF6F91" stroke="#D94373" stroke-width="5"/><path d="M275 64 C310 12 285 -7 268 14 C255 31 261 50 262 63" fill="#FF9DB7" stroke="#D94373" stroke-width="5"/><ellipse cx="168" cy="175" rx="143" ry="145" fill="url(#pink)" stroke="#D94373" stroke-width="6"/><ellipse cx="168" cy="198" rx="102" ry="91" fill="#FFC6D7"/><ellipse cx="119" cy="151" rx="15" ry="21" fill="#18203B"/><ellipse cx="218" cy="151" rx="15" ry="21" fill="#18203B"/><circle cx="114" cy="144" r="5" fill="#fff"/><circle cx="213" cy="144" r="5" fill="#fff"/><ellipse cx="83" cy="187" rx="19" ry="11" fill="#FF7F9E"/><ellipse cx="251" cy="187" rx="19" ry="11" fill="#FF7F9E"/><path d="M144 204 Q168 225 192 204" fill="none" stroke="#A52E5C" stroke-width="6" stroke-linecap="round"/><rect x="119" y="218" width="106" height="150" rx="20" fill="#202844" stroke="#fff" stroke-width="7" transform="rotate(-8 172 293)"/><rect x="133" y="236" width="77" height="104" rx="7" fill="#A9D8FF" transform="rotate(-8 172 293)"/><circle cx="172" cy="352" r="5" fill="#fff"/></g><g transform="translate(790 510) rotate(-4)" filter="url(#shadow)"><path d="M0 0 h130 v90 h-130 z" fill="#FFE38B"/><path d="M130 22 q42 -4 36 29 q-5 24 -36 18" fill="none" stroke="#D49A25" stroke-width="10"/><text x="12" y="35" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#63461C">MY LIFE</text><text x="12" y="59" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#63461C">IS A MEME</text></g><text x="600" y="590" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#30395C">STAY CURIOUS. STAY PLAYFUL.</text></svg>